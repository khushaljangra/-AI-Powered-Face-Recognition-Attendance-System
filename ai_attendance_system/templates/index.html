<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Attendance Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <meta http-equiv="refresh" content="5"> <!-- Auto refresh every 5 seconds -->
    <style>
        body { background-color: #f8f9fa; }
        .container { margin-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .header { background: #007bff; color: white; padding: 20px; border-radius: 15px 15px 0 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header text-center">
                <h2>🎯 AI-Powered Face Recognition Attendance</h2>
                <p>Today's Logs: {{ date }}</p>
            </div>
            <div class="card-body">
                <table class="table table-hover">
                    <thead class="table-light">
                        <tr>
                            <th>Name</th>
                            <th>Time</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for entry in attendance %}
                        <tr>
                            <td>{{ entry.Name }}</td>
                            <td>{{ entry.Time }}</td>
                            <td><span class="badge bg-success">{{ entry.Status }}</span></td>
                        </tr>
                        {% endfor %}
                        {% if not attendance %}
                        <tr>
                            <td colspan="3" class="text-center text-muted">No attendance marked yet today.</td>
                        </tr>
                        {% endif %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
